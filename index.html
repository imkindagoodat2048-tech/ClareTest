<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #baseBtn {
            width: 80px;
            height: 30px;
            font-size: 12px;
        }

        #display {
            font-size: 20px;
            text-align: center;
        }

        #gifgifgif {
            display: none;
            position: fixed;
            width: 100vw; 
            height: 100vh;
        }

        #freeze {
            display: none;
            position: fixed;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <button id="baseBtn">test button</button>
    <span id="display">you need 100 more</span>
    <img id="gifgifgif" src="assets/expo.gif">
    <img id="freeze" src="assets/freeze.png">

    <script>
        let count = 0;

        document.getElementById('baseBtn').onclick = function() {
            count = count + 1;
            document.getElementById('display').innerText = "you need " + (100 - count) + " more";

            if (count == 100) {
                document.getElementById('display').innerText = "done";
                document.getElementById('gifgifgif').style.display = "block";

                setTimeout(function() {
                    document.getElementById('gifgifgif').src = document.getElementById('freeze').src;
                }, 833);
            }
        };
    </script>

</body>
</html>
