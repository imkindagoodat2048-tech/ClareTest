<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>
<!-- BASICS -->
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #baseBtn {
            width: 80px;
            height: 30px;
            font-size: 12px;
        }

        #display {
            font-size: 20px;
            text-align: center;
        }
    </style>

</head>
<body>

    <button id="baseBtn">test button</button>
    <span id="display">0</span>

    <script>
        let count = 0;
        document.getElementById('baseBtn').onclick = () => {
            count = count + 1;
            document.getElementById('display').innerText = `you need ${100 - count} more`;
        };
    </script>

</body>
</html>
