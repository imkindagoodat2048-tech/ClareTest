<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>

    <!-- im just going off of pure aura here -->
    <style>
        #baseBtn {
            width: 200px;
            height: 60px;
            font-size: 20px;
            margin: 50px; 
        }

        #display {
            font-size: 50px;
            display: block;
            margin-left: 50px;
        }
    </style>

</head>
<body>

    <button id="baseBtn">test button</button>
    <span id="display">0</span>

    <script>

let count = 0
        document.getElementById('baseBtn').onclick = () => {
            count = count + 1;
            document.getElementById('display').innerText = count;
        };
    </script>

</body>
</html>
