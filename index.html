<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>
<!-- BASICS -->
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #baseBtn {
            width: 80px;
            height: 30px;
            font-size: 12px;
        }

        #display {
            font-size: 20px;
            text-align: center;
        }
        #gifgifgif {
            width: 100vw; 
            height: auto;
        }
    </style>

</head>
<body>

    <button id="baseBtn">test button</button>
    <span id="display">you need 100 more</span>
    <img id="gifgifgif" src="assets/expo.gif">

    <script>
        let count = 0;
        document.getElementById('baseBtn').onclick = () => {
            count = count + 1;
            document.getElementById('display').innerText = `you need ${100 - count} more`;
            if (count >= 100) {
              setTimeout(() => {
                document.getElementById("gifgifgif").src = "assets/freeze.png";
              }, 1000);
            };
                
                
        };
    </script>

</body>
</html>
