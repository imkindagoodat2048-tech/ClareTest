<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>

    <!-- basically just a normal button test idrc -->
    <style>
        #baseBtn {
            width: 60px;
            height: 30px;
            font-size: 10px;
            margin: auto; 
        }

        #display {
            width: 30px;
            height: 30px;
            font-size: 15px;
            display: block;
            margin: auto;
            text-align: center;
        }
    </style>

</head>
<body>

    <button id="baseBtn">test button</button>
    <span id="display">0</span>

    <script>

let count = 0
        document.getElementById('baseBtn').onclick = () => {
            count = count + 1;
            document.getElementById('display').innerText = count;
        };
    </script>

</body>
</html>
